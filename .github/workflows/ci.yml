name: Quality checks

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main, "fix/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
