name: Seed simulated practice jobs

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Choose SEED_SIMULATED_JOBS to confirm the database upsert"
        required: true
        type: choice
        options:
          - NO
          - SEED_SIMULATED_JOBS
        default: NO

permissions:
  contents: read

concurrency:
  group: seed-practice-jobs
  cancel-in-progress: false

jobs:
  seed:
    if: inputs.confirm == 'SEED_SIMULATED_JOBS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Upsert simulated practice listings into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run seed:practice-jobs
